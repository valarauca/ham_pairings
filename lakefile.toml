name = "prefect-pairing"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Suppression", "Repair"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "ham-spin"
git = "https://github.com/valarauca/ham-spin"
rev = "a2e899617d2fd82350f6ece799f776170bfe6bff"

[[lean_lib]]
name = "Suppression"
srcDir = "suppression"

[[lean_lib]]
name = "Repair"
srcDir = "repair"
