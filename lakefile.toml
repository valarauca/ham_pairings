name = "prefect-pairing"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Pairing", "Suppression", "Repair"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "ham-spin"
path = "../ham-spin"

[[lean_lib]]
name = "Pairing"
srcDir = "core"
roots = ["Pairing.RoundRobin"]
globs = ["Pairing", "Pairing.RoundRobin"]

[[lean_lib]]
name = "Suppression"
srcDir = "suppression"

[[lean_lib]]
name = "Repair"
srcDir = "repair"
